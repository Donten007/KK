openapi: 3.0.3

info:
  title: OPCAgentAI API
  version: 1.0.0
  description: |
    多租户 SaaS 平台 API 契约。中小企业老板的「AI 员工」平台。

    ## 契约规则（铁律）

    1. **本文件是前后端唯一机器可读依据。** 前端用 `openapi-typescript` 生成 TS 类型，
       后端用同一文件校验实现。SPEC.md 第 5 章是本文档的索引与设计约束说明。
    2. **统一响应格式**：`{ "code": 0, "data": {}, "message": "" }`。
       `code=0` 成功，非 0 为业务错误码。
    3. **所有端点必须带 `/api/v1/` 版本前缀。**
    4. **跨租户访问一律返回 404，绝不返回 403。** 403 本身会泄露资源存在性，
       形成可批量扫描的 oracle（见 SPEC.md §4.4）。租户内权限不足才用 403。
    5. **所有 `POST` 创建类端点接受 `Idempotency-Key` 头**（至少类��）。

    ## 两个必须分开的用量视图

    `GET /usage/summary` 与 `GET /settings/usage` **刻意是两个独立 endpoint + 两个独立 schema**，
    而非同一 endpoint 按角色 oneOf。原因：owner 视图的 schema 里**不得出现 token/model/duration 字段**
    （连 nullable 都不行）。若共用 schema，泄漏就依赖于「每个人每次都记得剔除」；
    独立 schema 时泄漏在**结构上不可能发生**（AC-14b / ADR-017）。

    前端 owner 组件若访问 token 字段，将直接编译报错——这是契约层的第一道防线。
    第二道防线在数据层：owner 口径的数据来源为 `tasks` + `usage_daily` 成本聚合，
    **不读 `usage_records` 的 token 字段**。

  contact:
    name: OPCAgentAI
  license:
    name: Proprietary

servers:
  - url: https://api.opcagentai.com
    description: 生产环境
  - url: https://api.staging.opcagentai.com
    description: 预发环境
  - url: http://localhost:8000
    description: 本地开发

tags:
  - name: auth
    description: 注册、登录、token 生命周期
  - name: tenants
    description: 账套（租户）与成员
  - name: credentials
    description: BYOK 密钥管理（永不回显全文）
  - name: models
    description: 模型与能力标签
  - name: job-templates
    description: 岗位模板库
  - name: agents
    description: AI 员工（编制）与组织树
  - name: goals
    description: 长任务（Goal）
  - name: tasks
    description: 任务中心聚合视图
  - name: conversations
    description: 会话
  - name: events
    description: SSE 事件流
  - name: knowledge
    description: 知识源与检索
  - name: pending
    description: 待确认队列
  - name: reports
    description: 每日汇报
  - name: usage
    description: 用量（owner 口径，无 token）
  - name: billing
    description: 计费与预算
  - name: assets
    description: 资产中心
  - name: memories
    description: 记忆系统
  - name: integrations
    description: 集成（企微、出网白名单）
  - name: audit
    description: 审计日志
  - name: analytics
    description: 埋点上报

security:
  - bearerAuth: []

paths:

  # ========== auth ==========
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: 邮箱注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, writeOnly: true }
                company_name: { type: string }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '1001': { $ref: '#/components/responses/ValidationFailed' }
        '1007': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录，签发 token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '1001': { $ref: '#/components/responses/ValidationFailed' }
        '1002': { $ref: '#/components/responses/Unauthorized' }
        '1007': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 token（refresh rotation，旧 token 立即失效）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '1002': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 吊销 refresh token
      responses:
        '200':
          description: 已登出
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前用户信息
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }

  # ========== tenants ==========
  /api/v1/tenants:
    post:
      tags: [tenants]
      summary: 创建账套，签发 tenant_code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tenant' }

  /api/v1/tenants/current:
    get:
      tags: [tenants]
      summary: 账套详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tenant' }
    patch:
      tags: [tenants]
      summary: 更新账套（owner）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tenant' }
        '1003': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [tenants]
      summary: 彻底删除账套（AC-16）
      description: |
        **彻底删除含向量表与 LangGraph checkpoint 表**（AC-16）。
        仅软删除业务表会留下向量与检查点残留，等于没删。

        删除范围（每一步均须执行，**失败即中止，不允许部分删除后返回成功**）：
        1. 全部业务表（RLS 强制）
        2. `kb_chunks`（pgvector 向量表）—— **易漏项**
        3. `langgraph_checkpoints.*`（任务 checkpoint）—— **易漏项**
        4. `auth_refresh_tokens` / `analytics_events`
        5. `tenant_egress_allowlist`
        6. 对象存储前缀 `tenants/{code}/`
        7. Redis key 前缀 `tenant:{id}:`
        8. 该租户全部沙箱（按 `--label tenant_id` 批量销毁）

        **过程可审计**：每一步写 `audit_logs`，事件类型 `tenant_purge_step`。
      parameters:
        - name: X-Confirm
          in: header
          required: true
          description: 防误删确认头。缺此头直接拒绝，避免误触。
          schema:
            type: string
            enum: [DELETE-ALL-DATA]
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '1003': { $ref: '#/components/responses/Forbidden' }

  /api/v1/tenants/current/export:
    get:
      tags: [tenants]
      summary: 数据导出（owner）
      responses:
        '200':
          description: 导出包
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExportPackage' }
        '1003': { $ref: '#/components/responses/Forbidden' }

  /api/v1/tenants/current/switch:
    post:
      tags: [tenants]
      summary: 切换当前账套
      description: |
        返回该账套作用域下的新 access token。

        **切换的是 RLS 的 `SET LOCAL app.current_tenant` 上下文**——
        切换后所有后续查询自动被新租户的 RLS 策略约束，前端不需要传 tenant_id。

        跨租户语义：用户不属于目标账套时返回 404（不返回 403）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        '200':
          description: 切换成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthResult' }
        '1004': { $ref: '#/components/responses/NotFound' }

  /api/v1/tenants/current/members:
    get:
      tags: [tenants]
      summary: 成员列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Member' }
    post:
      tags: [tenants]
      summary: 邀请成员（admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/TenantRole' }
      responses:
        '201':
          description: 已邀请
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Member' }
        '1003': { $ref: '#/components/responses/Forbidden' }
        '1005': { $ref: '#/components/responses/Conflict' }

  /api/v1/tenants/current/members/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [tenants]
      summary: 改角色（立即生效，admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/TenantRole' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Member' }
        '1003': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [tenants]
      summary: 移除成员（admin）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '1003': { $ref: '#/components/responses/Forbidden' }

  # ========== credentials ==========
  /api/v1/settings/credentials:
    get:
      tags: [credentials]
      summary: 凭据列表（只返回末 4 位，永不回显全文）
      description: '**响应中不存在明文密钥字段**（AC-15）。仅有 `key_suffix` 末 4 位。'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Credential' }
    post:
      tags: [credentials]
      summary: 新增 BYOK 密钥（admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, api_key, label]
              properties:
                provider: { $ref: '#/components/schemas/Provider' }
                api_key: { type: string, writeOnly: true, description: '仅写入，绝不回显' }
                label: { type: string }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Credential' }
        '1003': { $ref: '#/components/responses/Forbidden' }
        '3003': { $ref: '#/components/responses/InvalidCredential' }

  /api/v1/settings/credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    patch:
      tags: [credentials]
      summary: 轮换密钥（admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, writeOnly: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Credential' }
    delete:
      tags: [credentials]
      summary: 删除密钥（admin）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/v1/settings/credentials/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    post:
      tags: [credentials]
      summary: 连通性 + 能力探测
      description: |
        调用模型厂商 API 探测能力，**探测结果缓存 24h**。
        探测失败一律判为**不支持**（fail-closed），不fail-open。
        探测本身会产生少量费用。
      responses:
        '200':
          description: 探测完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CredentialVerifyResult' }
        '3003': { $ref: '#/components/responses/InvalidCredential' }

  # ========== models ==========
  /api/v1/models:
    get:
      tags: [models]
      summary: 支持的模型 + 能力标签
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ModelCapability' }

  /api/v1/models/{provider}/{model_id}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Provider' }
      - name: model_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [models]
      summary: 单模型能力详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelCapability' }
        '1004': { $ref: '#/components/responses/NotFound' }

  # ========== job templates ==========
  /api/v1/job-templates:
    get:
      tags: [job-templates]
      summary: 岗位卡片墙
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/JobTemplate' }

  /api/v1/job-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/JobTemplateId'
    get:
      tags: [job-templates]
      summary: 岗位详情（五要素 + 四组技术字段）
      description: |
        四组技术字段任一为空时，该岗位**不允许上架**：
        `required_caps` / `optional_caps` / `expected_idle_steps` / `expected_total_steps`。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobTemplate' }
        '1004': { $ref: '#/components/responses/NotFound' }

  # ========== agents ==========
  /api/v1/agents:
    get:
      tags: [agents]
      summary: AI 员工列表（含值班状态、本月成本）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Agent' }
    post:
      tags: [agents]
      summary: 从岗位模板创建 AI 员工（admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_template_id, name]
              properties:
                job_template_id: { type: string }
                name: { type: string }
                parent_id: { type: string, format: uuid, nullable: true, description: '汇报线父节点' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Agent' }
        '1003': { $ref: '#/components/responses/Forbidden' }
        '1005': { $ref: '#/components/responses/Conflict' }

  /api/v1/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      summary: AI 员工详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Agent' }
        '1004': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [agents]
      summary: 更新（**执行中改配置必须被拒绝**，admin）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Agent' }
        '1005': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [agents]
      summary: 删除（在途任务跑完，admin）
      description: 停用时**跑完当前任务 + 新任务不再派发**（不立即终止在途任务）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/v1/agents/org/tree:
    get:
      tags: [agents]
      summary: 组织树（递归 CTE，max_depth=10）
      parameters:
        - name: root_agent_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OrgNode' }

  /api/v1/agents/{id}/schedule:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      summary: 排班配置
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Schedule' }
    put:
      tags: [agents]
      summary: 设置排班（**未成功试跑禁止开启**，admin）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Schedule' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Schedule' }
        '1005': { $ref: '#/components/responses/Conflict' }

  # ========== goals ==========
  /api/v1/goals:
    get:
      tags: [goals]
      summary: Goal 列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/GoalStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PagedList' }
    post:
      tags: [goals]
      summary: 创建 Goal（立即返回 goal_id，不等完成）
      description: |
        创建即返回，任务在后台执行。响应含**步骤数预估与费用预估**。
        预算不足时在**执行前阻断**（402），不允许透支。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, input]
              properties:
                agent_id: { type: string, format: uuid }
                input: { type: string }
                conversation_id: { type: string, format: uuid, nullable: true }
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Goal' }
        '2001': { $ref: '#/components/responses/BalanceInsufficient' }
        '2002': { $ref: '#/components/responses/BudgetExhausted' }
        '3001': { $ref: '#/components/responses/CapabilityInsufficient' }

  /api/v1/goals/{id}:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      tags: [goals]
      summary: 详情（含预估步数/费用对比）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/GoalDetail' }
        '1004': { $ref: '#/components/responses/NotFound' }

  /api/v1/goals/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    post:
      tags: [goals]
      summary: 中止（幂等，先置 stopping）
      description: |
        **幂等**：重复调用返回同一状态，不报错。UI 的 disabled 按钮是最后防线但不是唯一防线
        （用户可能开两个标签页或网络重试）。

        **实现顺序不可颠倒**：先置 `status=stopping` 再发协作式取消信号。
        否则用户点中止到看到反馈有 1-3 秒延迟，UI 无法显示中间态。

        **已完成步骤保留且不扣费**。5 秒未收敛则由巡检器强制置 `cancelled`。
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CancelResult' }
        '1004': { $ref: '#/components/responses/NotFound' }

  /api/v1/goals/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    post:
      tags: [goals]
      summary: 断点续跑
      description: 从最后 checkpoint 继续，**已完成步骤不重复执行、不重复计费**。
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Goal' }

  /api/v1/goals/{id}/steps:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      tags: [goals]
      summary: 分步轨迹（**业务语言**，禁用 Agent/节点/token 术语）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TaskStep' }

  /api/v1/goals/{id}/events:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      tags: [goals]
      summary: 事件流（按角色过滤 visibility）
      description: |
        **服务端按调用方角色过滤**：owner 只返回 `visibility='owner'` 的事件，
        admin 返回全部。过滤在服务端完成，不依赖前端。

        L3 审计类事件（`raw_prompt` / `raw_completion` / `token_usage`）**绝不返回给 owner**。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/GoalEvent' }

  # ========== tasks ==========
  /api/v1/tasks:
    get:
      tags: [tasks]
      summary: 任务中心聚合视图
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/GoalStatus' }
        - name: agent_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PagedList' }

  /api/v1/tasks/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
