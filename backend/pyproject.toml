[project]
name = "opcagentai-backend"
version = "0.1.0"
description = "OPCAgentAI AI 员工 SaaS 平台后端（多租户，纯 BYOK）"
requires-python = ">=3.13,<3.14"
dependencies = [
    # ---- Web 框架（SPEC §4.1 锁定；fastapi 0.143.1 实测时索引仅有 0.143.0，偏差见 VERSIONS.md）----
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "sse-starlette==3.5.0",
    "orjson==3.13.0",
    # ---- 数据层（SPEC §4.1 锁定）----
    "sqlalchemy==2.1.4",
    "greenlet==3.5.6",
    "psycopg[binary]==3.3.6",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "redis==8.1.0",
    # ---- 认证与安全（SPEC §4.1 锁定）----
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    # ---- Agent 内核（SPEC §4.1 锁定）----
    "langgraph==1.2.15",
    "langgraph-checkpoint-postgres==3.1.3",
    # ---- 可观测性（SPEC §4.1 锁定）----
    "structlog==26.1.0",
    # ---- HTTP 抓取（任务 C：L1 服务端抓取）----
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "email-validator==2.3.0",
    "lxml==6.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pip-audit==2.10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---- Ruff：行宽与规则 ----
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# 生成式代码纪律：禁止裸 except、禁止未使用 import 由 F 覆盖；
# B（bugbear）补 blind-except 与可变默认参数类缺陷。
ignore = [
    "E501",      # 行宽由 formatter 负责，lint 不重复报
    "RUF001",    # 中文全角标点不是歧义字符（本项目文案中文为主）
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E", "F", "I"]  # 迁移文件由 env.py 注入上下文，静态规则放宽

# ---- mypy：严格模式（幻觉签名的第一道门）----
[tool.mypy]
python_version = "3.13"
# 统一按 win32 平台语义检查：runtime.py 有 Windows 专属事件循环分支，
# Linux CI 下不设此项会把 win32 分支判为 unreachable（本机 Windows 则不会）——
# 平台语义必须与本机一致，否则 CI 和本地各判各的。
platform = "win32"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["mversions/", "build/"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langgraph_checkpoint_postgres.*"]
# 第三方库类型存根不全，禁止跟着 strict 报错淹没真实问题
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lxml.*"]
# lxml 无官方类型存根（lxml-stubs 未纳入锁版本），本模块已自行标注关键签名
ignore_missing_imports = true

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "blocking: 阻断级测试（失败即禁止发布，SPEC §9.8）",
    "requires_db: 需要真实 PostgreSQL 实例（CI 提供；本地无实例时 skip）",
    "requires_redis: 需要真实 Redis 实例",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
