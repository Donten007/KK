name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端（lint / type-check / 全量测试）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 安装依赖（精确锁版本）
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: 数据库引导（建库/角色/RLS/迁移）
        run: bash scripts/bootstrap_dev_db.sh
      - name: lint（ruff）
        run: python -m ruff check .
      - name: type-check（mypy strict）
        run: python -m mypy app/
      - name: 全量测试（含 PG 端到端 + RLS 隔离 + 跨租户 404）
        run: python -m pytest tests/ -q --no-header
      - name: P0 红线扫描（emoji / 紫粉渐变 / 占位文案）
        run: |
          HITS=$(grep -rP '[\x{1F300}-\x{1F9FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}]|7C3AED|Lorem ipsum' --include="*.py" app/ tests/ | grep -v "禁止" || true)
          if [ -n "$HITS" ]; then echo "$HITS"; exit 1; fi
          echo "P0 扫描通过"

  frontend:
    name: 前端（lint / type-check / P0 门禁 / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 完整门禁（lint + type-check + 8 项 P0）
        run: npm run verify
      - name: 构建
        run: npm run build

  docs-gates:
    name: 文档与契约门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装门禁脚本依赖
        run: pip install pyyaml
      - name: openapi 契约门禁（含 owner 侧 schema 注入断言）
        run: python docs/scripts/verify-openapi.py
      - name: 跨文档一致性门禁（反引号 / §引用 / 术语冲突）
        run: python docs/scripts/verify-consistency.py
      - name: 埋点白名单三方一致（代码 ↔ 白名单 ↔ openapi enum）
        run: python docs/scripts/verify-tracking.py
